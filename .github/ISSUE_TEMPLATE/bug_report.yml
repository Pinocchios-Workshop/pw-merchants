name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the shop of …
        2. Type `weapon-group:sword` in the search …
        3. …
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module version
      placeholder: "0.55.0"
    validations:
      required: true
  - type: input
    id: foundry
    attributes:
      label: Foundry VTT and PF2e versions
      placeholder: "Foundry 14.xxx, PF2e 7.x"
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Who saw the problem?
      options: [GM, Player, Both]
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors (F12 → Console)
      render: text
